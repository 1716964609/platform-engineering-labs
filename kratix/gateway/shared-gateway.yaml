apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform-gwclass
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-edge
  namespace: platform-gateway
spec:
  gatewayClassName: platform-gwclass
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
