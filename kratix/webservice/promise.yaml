apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: webservice
  labels:
    kratix.io/promise-version: v0.2.0
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: webservices.lab.platform.example.com
    spec:
      group: lab.platform.example.com
      scope: Namespaced
      names:
        kind: WebService
        singular: webservice
        plural: webservices
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required:
                    - image
                    - hostname
                  properties:
                    image:
                      type: string
                      minLength: 1
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 5
                      default: 2
                    hostname:
                      type: string
                      minLength: 3
  workflows:
    promise: {}
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: webservice-configure
          spec:
            containers:
              - name: render
                image: kratix-webservice-pipeline:v0.2.0
                imagePullPolicy: Never
