apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: team-b-app-ingress
  namespace: team-b
spec:
  podSelector:
    matchLabels:
      app: team-b-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: team-b
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-gateway
      ports:
        - protocol: TCP
          port: 80
